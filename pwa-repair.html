<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#061a31">
  <title>TOM FX ZERO｜画面更新</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}
    body{margin:0;min-height:100dvh;display:grid;place-items:center;background:linear-gradient(155deg,#031226,#08294a);color:#f4f8ff}
    main{box-sizing:border-box;width:min(92vw,440px);padding:28px 24px;border:1px solid #2f6c9c;border-radius:20px;background:#092744;box-shadow:0 16px 48px #0008}
    h1{margin:0 0 12px;font-size:1.35rem}p{color:#bfd2e6;line-height:1.7}
    button{width:100%;min-height:54px;border:0;border-radius:13px;background:#ff8538;color:#112136;font-weight:800;font-size:1rem}
    small{display:block;margin-top:14px;color:#8faec8;line-height:1.5}
  </style>
</head>
<body>
  <main>
    <h1>画面を最新化します</h1>
    <p>接続口座・ペアリング情報は残したまま、古いPWAの画面キャッシュだけを更新します。</p>
    <button id="repair" type="button">最新画面へ更新</button>
    <small id="status">ボタンを押してください。</small>
  </main>
  <script>
    const status=document.getElementById('status');
    document.getElementById('repair').addEventListener('click',async()=>{
      const button=document.getElementById('repair');
      button.disabled=true;
      button.textContent='更新中…';
      status.textContent='古い画面キャッシュを解除しています。';
      try{
        if('serviceWorker' in navigator){
          const registrations=await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map(registration=>registration.unregister()));
        }
        if('caches' in window){
          const keys=await caches.keys();
          await Promise.all(keys.map(key=>caches.delete(key)));
        }
        status.textContent='更新しました。ホームを開きます。';
        setTimeout(()=>location.replace('./?pwa-repaired=1'),500);
      }catch(error){
        button.disabled=false;
        button.textContent='もう一度更新する';
        status.textContent='更新できませんでした。通信を確認してもう一度押してください。';
      }
    });
  </script>
</body>
</html>
